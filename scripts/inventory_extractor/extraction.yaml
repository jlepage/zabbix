# extraction.yaml
# Mapping : <champ_zabbix>: <nom_colonne_csv/xlsx>  (ou "excluded" pour désactiver)
# Règle : deux champs, tous types confondus, ne peuvent pas pointer vers la même colonne.

host_properties:
  hostid: Id
  host: Nom              # nom technique de l'host
  name: excluded                # nom visible
  description: excluded
  status: "Statut"              # voir value_labels
  proxyid: excluded
  inventory_mode: excluded      # -1=disabled, 0=manual, 1=automatic
  groups: excluded              # noms des groupes (jointure virgule)

# Optionnel : libellés d'affichage pour host_properties.status, pour éviter
# de devoir mémoriser que 0=activé et 1=désactivé (contre-intuitif dans
# l'API Zabbix). Sans cette section, les valeurs brutes 0/1 sont exportées
# telles quelles. Ne s'applique que si host_properties.status est actif
# (décommentez les deux blocs ensemble).
value_labels:
  status:
    enable: "Activé"
    disable: "Désactivé"

inventory_fields:
  type: excluded
  type_full: "Ressources"
  name: excluded                 # "Name" de l'inventaire (distinct de host.name)

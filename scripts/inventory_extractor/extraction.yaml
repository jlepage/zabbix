# Interfaces réseau. Une colonne par type (jamais de credentials extraits : les
# éventuelles community strings SNMP / identifiants SNMPv3 ne sont jamais lus).
# Adresse = ip si useip=1, sinon dns. Port affiché uniquement si non standard
# (10050=agent, 161=snmp, 623=ipmi, 12345=jmx). Plusieurs interfaces du même
# type -> jointure virgule.
interfaces:
  agent: "Adr. Zabbix"
  snmp: excluded
  ipmi: excluded
  jmx: excluded

# Les tags sont libres (propres à votre organisation) : pas de liste exhaustive
# possible. Dupliquez la ligne ci-dessous pour chaque tag à extraire.
# Valeurs multiples pour un même tag -> jointure virgule dans la colonne.
tags:
  project: Project
  provider: Supplier
  location: Country
  pop: "Point of Presence"
  # environment: Environnement

      discovery_rules:
        - uuid: cf264a6d2f8f4c0d8359dd222e7b4b56
          name: 'Jira project discovery'
          type: SCRIPT
          key: jira.project.discovery
          delay: 1h
          params: |
            /*
             * Zabbix master item (Script) - Découverte des PROJETS JIRA
             *
             * Rôle : alimenter la LLD "Projets Jira". Aucun filtre n'est appliqué ici :
             * tous les projets du site sont remontés avec leur type. Le tri se fait
             * côté Zabbix, dans les conditions de filtre de la règle de découverte
             * (macros {$JIRA.PROJECT.*.MATCHES} / {$JIRA.PROJECT.*.NOT.MATCHES}).
             *
             * Paramètres attendus dans "value" (JSON), depuis les macros host :
             * {
             *   "base_url":  "{$JIRA.BASE_URL}",
             *   "email":     "{$JIRA.EMAIL}",
             *   "api_token": "{$JIRA.API_TOKEN}",
             *   "proxy":     "" // optionnel
             * }
             *
             * Sortie - volontairement épurée au strict nécessaire (pas de "self",
             * avatarUrls, expand, etc.) et triée par "key" : c'est ce qui permet
             * d'ajouter un preprocessing "Discard unchanged" en aval sans qu'il soit
             * neutralisé par un ordre de tableau non déterministe côté API Jira.
             * {
             *   "errors": "",
             *   "projects": [
             *     { "id": "10020", "key": "DATA", "name": "DATA", "type": "business" },
             *     ...
             *   ]
             * }
             *
             * Authentification : Basic Auth (email + API token classique, non scoped),
             * via btoa() natif Duktape/Zabbix.
             *
             * Permissions nécessaires sur le compte Jira : "Browse Projects" (lecture
             * seule) sur les projets à superviser.
             *
             * Endpoint utilisé : GET /rest/api/3/project/search. Pagination classique
             * startAt/maxResults/isLast - non concerné par la dépréciation CHANGE-2046
             * (qui ne touche que la recherche d'ISSUES, /search -> /search/jql).
             */

            var Jira = {
            	params: {},
            	base_url: null,
            	auth_header: null,
            	http: null,

            	setParams: function (params) {
            		['base_url', 'email', 'api_token'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: ' + field + '.';
            			}
            		});

            		Jira.params = params;
            		Jira.base_url = params.base_url.replace(/\/+$/, ''); // retire le / final éventuel
            		Jira.auth_header = 'Basic ' + btoa(params.email + ':' + params.api_token);

            		Jira.http = new HttpRequest();
            		if (typeof params.proxy !== 'undefined' && params.proxy !== '') {
            			Jira.http.setProxy(params.proxy);
            		}
            	},

            	request: function (path) {
            		var url = Jira.base_url + path,
            			response;

            		Jira.http.clearHeader();
            		Jira.http.addHeader('Authorization: ' + Jira.auth_header);
            		Jira.http.addHeader('Accept: application/json');

            		Zabbix.log(4, '[ Jira ] Sending request: GET ' + url);
            		response = Jira.http.get(url);
            		Zabbix.log(4, '[ Jira ] Received response with status code ' + Jira.http.getStatus() + ': ' + response);

            		if (Jira.http.getStatus() === 401) {
            			throw 'Unauthorized (401) on GET ' + path + '. Check email/api_token (compte, token expiré ou révoqué).';
            		}
            		if (Jira.http.getStatus() === 403) {
            			throw 'Forbidden (403) on GET ' + path + '. Check account permissions (Browse Projects).';
            		}
            		if (Jira.http.getStatus() !== 200 || response === null) {
            			throw 'Request failed with status code ' + Jira.http.getStatus() + ': ' + response;
            		}

            		try {
            			return JSON.parse(response);
            		}
            		catch (error) {
            			throw 'Failed to parse response received from API for ' + path + '.';
            		}
            	}
            };

            var data = { errors: {}, projects: [] };

            try {
            	Jira.setParams(JSON.parse(value));
            }
            catch (error) {
            	data.errors.auth = error.toString();
            }

            if (!('auth' in data.errors)) {
            	try {
            		var start_at = 0,
            			max_results = 50,
            			is_last = false;

            		while (!is_last) {
            			var page = Jira.request('/rest/api/3/project/search?startAt=' + start_at + '&maxResults=' + max_results);

            			(page.values || []).forEach(function (project) {
            				data.projects.push({
            					id: project.id,
            					key: project.key,
            					name: project.name,
            					type: project.projectTypeKey
            				});
            			});

            			is_last = (page.isLast === true) || !page.values || page.values.length === 0;
            			start_at += max_results;
            		}

            		// Tri déterministe : indispensable pour que le preprocessing
            		// "Discard unchanged" en aval compare des chaînes stables d'un
            		// run à l'autre (l'API Jira ne garantit pas l'ordre de retour).
            		data.projects.sort(function (a, b) {
            			return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0);
            		});
            	}
            	catch (error) {
            		data.errors.projects = error.toString();
            	}
            }

            if (Object.keys(data.errors).length !== 0) {
            	var errors = 'Failed to receive data:';
            	for (var error_key in data.errors) {
            		errors += '\n' + error_key + ' : ' + data.errors[error_key];
            	}
            	data.errors = errors;
            }
            else {
            	data.errors = '';
            }

            return JSON.stringify(data);
          filter:
            evaltype: AND
            conditions:
              - macro: '{#PROJECT.KEY}'
                value: '{$JIRA.PROJECT.KEY.MATCHES}'
              - macro: '{#PROJECT.KEY}'
                value: '{$JIRA.PROJECT.KEY.NOT.MATCHES}'

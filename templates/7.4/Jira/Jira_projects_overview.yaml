        - uuid: 020e2ca08e824911939b842821802b2f
          name: 'Jira data collecte'
          type: SCRIPT
          key: jira.tickets.data.raw
          delay: 30m
          history: '0'
          value_type: TEXT
          params: |
            /*
             * Zabbix master item (Script) - Statistiques des tickets JIRA par projet
             *
             * Rôle : alimenter les items dépendants "jira.tickets.*[{#PROJECT.KEY}]"
             * créés par la LLD de découverte des projets (jira_projects_discovery.js).
             *
             * Design : 3 requêtes JQL larges (tous projets confondus, paginées) plutôt
             * que N projets x M métriques en appels unitaires. Réduit drastiquement le
             * nombre d'appels HTTP et le risque de rate limiting Jira Cloud - le coût
             * ne croît pas avec le nombre de projets supervisés.
             * Aucun filtre "project in (...)" n'est appliqué : ce script remonte les
             * métriques de tous les projets visibles par le compte de service, c'est
             * la règle de découverte (déjà filtrée par macros regex) qui décide quels
             * projets ont effectivement un item créé côté Zabbix.
             *
             * Paramètres (Parameters de l'item - identiques à jira_projects_discovery.js) :
             *   base_url, email, api_token
             *
             * Sortie, triée par "key" :
             * {
             *   "errors": "",
             *   "metrics": [
             *     {
             *       "key": "PAY",
             *       "open": 12,
             *       "new_7d": 3,
             *       "resolved_7d": 5,
             *       "overdue": 2,
             *       "unassigned": 4,
             *       "bugs_open": 3,
             *       "high_priority_open": 1,
             *       "open_age_lt_3m": 6,
             *       "open_age_3_6m": 5,
             *       "open_age_6_12m": 2,
             *       "open_age_gt_12m": 1,
             *       "open_avg_age_seconds": 4082400
             *     },
             *     ...
             *   ]
             * }
             *
             * Endpoint : GET /rest/api/3/search/jql (remplace /rest/api/3/search,
             * supprimé - HTTP 410 - depuis mai 2025, cf. CHANGE-2046). Pagination par
             * nextPageToken/isLast UNIQUEMENT - pas de startAt, pas de total.
             *
             * Hypothèses à ajuster selon votre configuration Jira (noms de priorité,
             * de type de ticket) : constantes HIGH_PRIORITY_NAMES / BUG_TYPE_NAMES
             * ci-dessous.
             */

            var HIGH_PRIORITY_NAMES = ['Highest', 'High'];
            var BUG_TYPE_NAMES = ['Bug'];
            var MAX_RESULTS = 100;

            // Tranches d'ancienneté du backlog ouvert, EXCLUSIVES (un ticket n'incrémente
            // qu'un seul compteur, celui de la tranche la plus élevée qu'il atteint).
            // Ordre décroissant, seuil final à 0 pour que la partition soit exhaustive
            // (la somme des 4 tranches = "open") : indispensable pour un pie chart ou
            // une aire empilée qui doit représenter 100% du backlog ouvert.
            var AGE_BUCKETS = [
            	{ key: 'open_age_gt_12m', min_days: 365 },  // 12 mois et plus
            	{ key: 'open_age_6_12m', min_days: 180 },   // 6 à 12 mois
            	{ key: 'open_age_3_6m', min_days: 90 },     // 3 à 6 mois
            	{ key: 'open_age_lt_3m', min_days: 0 }      // moins de 3 mois
            ];

            var Jira = {
            	params: {},
            	base_url: null,
            	auth_header: null,
            	http: null,

            	setParams: function (params) {
            		['base_url', 'email', 'api_token'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: ' + field + '.';
            			}
            		});

            		Jira.params = params;
            		Jira.base_url = params.base_url.replace(/\/+$/, '');
            		Jira.auth_header = 'Basic ' + btoa(params.email + ':' + params.api_token);

            		Jira.http = new HttpRequest();
            		if (typeof params.proxy !== 'undefined' && params.proxy !== '') {
            			Jira.http.setProxy(params.proxy);
            		}
            	},

            	request: function (path) {
            		var url = Jira.base_url + path,
            			response;

            		Jira.http.clearHeader();
            		Jira.http.addHeader('Authorization: ' + Jira.auth_header);
            		Jira.http.addHeader('Accept: application/json');

            		Zabbix.log(4, '[ Jira ] Sending request: GET ' + url);
            		response = Jira.http.get(url);
            		Zabbix.log(4, '[ Jira ] Received response with status code ' + Jira.http.getStatus() + ': ' + response);

            		if (Jira.http.getStatus() === 401) {
            			throw 'Unauthorized (401) on GET ' + path + '. Check email/api_token.';
            		}
            		if (Jira.http.getStatus() === 403) {
            			throw 'Forbidden (403) on GET ' + path + '. Check account permissions (Browse Projects).';
            		}
            		if (Jira.http.getStatus() !== 200 || response === null) {
            			throw 'Request failed with status code ' + Jira.http.getStatus() + ': ' + response;
            		}

            		try {
            			return JSON.parse(response);
            		}
            		catch (error) {
            			throw 'Failed to parse response received from API for ' + path + '.';
            		}
            	},

            	// Pagine sur /search/jql (nextPageToken/isLast) et appelle onIssue()
            	// pour chaque ticket retourné. fields : liste CSV des champs Jira à
            	// demander (garder minimal, ça influe directement sur la taille de page).
            	searchAll: function (jql, fields, onIssue) {
            		var next_page_token = null,
            			is_last = false;

            		while (!is_last) {
            			var path = '/rest/api/3/search/jql?jql=' + encodeURIComponent(jql) +
            				'&fields=' + encodeURIComponent(fields) +
            				'&maxResults=' + MAX_RESULTS;

            			if (next_page_token !== null) {
            				path += '&nextPageToken=' + encodeURIComponent(next_page_token);
            			}

            			var page = Jira.request(path);

            			(page.issues || []).forEach(onIssue);

            			is_last = (page.isLast === true) || !page.issues || page.issues.length === 0;
            			next_page_token = page.nextPageToken || null;
            		}
            	}
            };

            var data = { errors: {}, metrics: [] };
            var by_project = {};

            function ensure(key) {
            	if (!by_project[key]) {
            		by_project[key] = {
            			key: key,
            			open: 0,
            			new_7d: 0,
            			resolved_7d: 0,
            			overdue: 0,
            			unassigned: 0,
            			bugs_open: 0,
            			high_priority_open: 0,
            			open_age_lt_3m: 0,
            			open_age_3_6m: 0,
            			open_age_6_12m: 0,
            			open_age_gt_12m: 0,
            			open_avg_age_seconds: 0,
            			_age_sum_ms: 0 // accumulateur interne, retiré avant sérialisation finale
            		};
            	}
            	return by_project[key];
            }

            try {
            	Jira.setParams(JSON.parse(value));
            }
            catch (error) {
            	data.errors.auth = error.toString();
            }

            if (!('auth' in data.errors)) {
            	var today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD, comparable lexicographiquement

            	// --- 1. Tous les tickets ouverts : alimente open/overdue/unassigned/bugs/priorité -----
            	try {
            		Jira.searchAll(
            			'statusCategory != Done',
            			'project,priority,issuetype,assignee,duedate,created',
            			function (issue) {
            				var f = issue.fields,
            					p = ensure(f.project.key);

            				p.open++;

            				if (f.duedate && f.duedate < today) {
            					p.overdue++;
            				}
            				if (!f.assignee) {
            					p.unassigned++;
            				}
            				if (f.issuetype && BUG_TYPE_NAMES.indexOf(f.issuetype.name) !== -1) {
            					p.bugs_open++;
            				}
            				if (f.priority && HIGH_PRIORITY_NAMES.indexOf(f.priority.name) !== -1) {
            					p.high_priority_open++;
            				}
            				if (f.created) {
            					var age_ms = Date.now() - new Date(f.created).getTime(),
            						age_days = age_ms / 86400000; // usage local, uniquement pour le bucketing ci-dessous

            					p._age_sum_ms += age_ms;

            					for (var i = 0; i < AGE_BUCKETS.length; i++) {
            						if (age_days >= AGE_BUCKETS[i].min_days) {
            							p[AGE_BUCKETS[i].key]++;
            							break; // tranche exclusive : on s'arrête au premier seuil atteint
            						}
            					}
            				}
            			}
            		);
            	}
            	catch (error) {
            		data.errors.open = error.toString();
            	}

            	// --- 2. Nouveaux tickets (7 derniers jours) --------------------------------------------
            	try {
            		Jira.searchAll(
            			'created >= -7d',
            			'project',
            			function (issue) {
            				ensure(issue.fields.project.key).new_7d++;
            			}
            		);
            	}
            	catch (error) {
            		data.errors.new_7d = error.toString();
            	}

            	// --- 3. Tickets résolus (7 derniers jours) ---------------------------------------------
            	try {
            		Jira.searchAll(
            			'statusCategory = Done AND resolutiondate >= -7d',
            			'project',
            			function (issue) {
            				ensure(issue.fields.project.key).resolved_7d++;
            			}
            		);
            	}
            	catch (error) {
            		data.errors.resolved_7d = error.toString();
            	}

            	for (var key in by_project) {
            		var p = by_project[key];
            		p.open_avg_age_seconds = p.open > 0 ? Math.round(p._age_sum_ms / 1000 / p.open) : 0;
            		delete p._age_sum_ms; // usage interne uniquement, pas d'intérêt côté Zabbix
            		data.metrics.push(p);
            	}
            	data.metrics.sort(function (a, b) {
            		return a.key < b.key ? -1 : (a.key > b.key ? 1 : 0);
            	});
            }

            if (Object.keys(data.errors).length !== 0) {
            	var errors = 'Failed to receive data:';
            	for (var error_key in data.errors) {
            		errors += '\n' + error_key + ' : ' + data.errors[error_key];
            	}
            	data.errors = errors;
            }
            else {
            	data.errors = '';
            }

            return JSON.stringify(data);
          timeout: 15s
          parameters:
            - name: api_token
              value: '{$JIRA.API_TOKEN}'
            - name: base_url
              value: '{$JIRA.BASE_URL}'
            - name: email

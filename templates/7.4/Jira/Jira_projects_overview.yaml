              - macro: '{#PROJECT.NAME}'
                value: '{$JIRA.PROJECT.NAME.NOT.MATCHES}'
                operator: NOT_MATCHES_REGEX
              - macro: '{#PROJECT.TYPE}'
                value: '{$JIRA.PROJECT.TYPE.MATCHES}'
              - macro: '{#PROJECT.TYPE}'
                value: '{$JIRA.PROJECT.TYPE.NOT.MATCHES}'
                operator: NOT_MATCHES_REGEX
          lifetime: 30d
          enabled_lifetime_type: DISABLE_AFTER
          enabled_lifetime: 1d
          item_prototypes:
            - uuid: a1db84ffc5f2476693486751673a51d7
              name: '3 to 6 months older for {#PROJECT.NAME}'
              type: DEPENDENT
              key: 'jira.tickets.age3to6m[{#PROJECT.KEY}]'
              history: 30d
              units: '!tickets'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.metrics[?(@.key==''{#PROJECT.KEY}'')].open_age_3_6m.first()'
              master_item:
                key: jira.tickets.data.raw
              tags:
                - tag: key
                  value: '{{#PROJECT.KEY}.lowercase()}'
                - tag: project
                  value: '{{#PROJECT.NAME}.lowercase()}'
                - tag: tickets_status
                  value: age3to6m
            - uuid: 3381b19bf5894beca12a342e9c9376fa
              name: '6 to 12 months older for {#PROJECT.NAME}'
              type: DEPENDENT
              key: 'jira.tickets.age6to12m[{#PROJECT.KEY}]'
              history: 30d
              units: '!tickets'
              preprocessing:

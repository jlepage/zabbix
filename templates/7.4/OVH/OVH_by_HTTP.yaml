        - uuid: ca17bdb2b9174974b311b0411ac7a139
          name: 'OVH servers discovery'
          type: SCRIPT
          key: ovh.servers.raw
          delay: 1h
          history: '0'
          value_type: TEXT
          status: DISABLED
          params: |
            /*
             * Zabbix master item (JavaScript / HTTP Agent) - Découverte des ressources OVH
             * Couvre : Public Cloud (instances), VPS, Serveurs dédiés (bare metal)
             *
             * Paramètres attendus dans "value" (JSON) :
             * {
             *   "application_key":    "...",
             *   "application_secret": "...",
             *   "consumer_key":       "...",
             *   "endpoint":           "ovh-eu" | "ovh-ca" | "ovh-us",
             *   "proxy":              "" // optionnel
             * }
             *
             * Sortie : { errors: "", resources: { value: [ {resourceType, serviceName, ...}, ... ] } }
             * -> Alimente une règle LLD unique, filtrée par macro {#RESOURCETYPE} pour les 3 prototypes d'items.
             */

            // --- SHA-1 pur JS (Duktape ne fournit que md5()/sha256() en natif) ---------
            function sha1(str) {
            	function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
            	function toHex(n) {
            		var s = '', v;
            		for (var i = 7; i >= 0; i--) {
            			v = (n >>> (i * 4)) & 0x0f;
            			s += v.toString(16);
            		}
            		return s;
            	}

            	str = unescape(encodeURIComponent(str)); // normalisation UTF-8 -> octets

            	var strLen = str.length,
            		wordArray = [];

            	for (var i = 0; i < strLen - 3; i += 4) {
            		wordArray.push(
            			(str.charCodeAt(i) << 24) |
            			(str.charCodeAt(i + 1) << 16) |
            			(str.charCodeAt(i + 2) << 8) |
            			(str.charCodeAt(i + 3))
            		);
            	}

            	switch (strLen % 4) {
            		case 0:
            			wordArray.push(0x080000000);
            			break;
            		case 1:
            			wordArray.push((str.charCodeAt(strLen - 1) << 24) | 0x0800000);
            			break;
            		case 2:
            			wordArray.push((str.charCodeAt(strLen - 2) << 24) | (str.charCodeAt(strLen - 1) << 16) | 0x08000);
            			break;
            		case 3:
            			wordArray.push((str.charCodeAt(strLen - 3) << 24) | (str.charCodeAt(strLen - 2) << 16) | (str.charCodeAt(strLen - 1) << 8) | 0x80);
            			break;
            	}

            	while ((wordArray.length % 16) !== 14) {
            		wordArray.push(0);
            	}
            	wordArray.push(strLen >>> 29);
            	wordArray.push((strLen << 3) & 0x0ffffffff);

            	var W = new Array(80),
            		H0 = 0x67452301, H1 = 0xEFCDAB89, H2 = 0x98BADCFE, H3 = 0x10325476, H4 = 0xC3D2E1F0,
            		A, B, C, D, E, temp;

            	for (var blockstart = 0; blockstart < wordArray.length; blockstart += 16) {
            		for (var i = 0; i < 16; i++) { W[i] = wordArray[blockstart + i]; }
            		for (var i = 16; i <= 79; i++) { W[i] = rotl(W[i - 3] ^ W[i - 8] ^ W[i - 14] ^ W[i - 16], 1); }

            		A = H0; B = H1; C = H2; D = H3; E = H4;

            		for (var i = 0; i <= 19; i++) {
            			temp = (rotl(A, 5) + ((B & C) | (~B & D)) + E + W[i] + 0x5A827999) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 20; i <= 39; i++) {
            			temp = (rotl(A, 5) + (B ^ C ^ D) + E + W[i] + 0x6ED9EBA1) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 40; i <= 59; i++) {
            			temp = (rotl(A, 5) + ((B & C) | (B & D) | (C & D)) + E + W[i] + 0x8F1BBCDC) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 60; i <= 79; i++) {
            			temp = (rotl(A, 5) + (B ^ C ^ D) + E + W[i] + 0xCA62C1D6) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}

            		H0 = (H0 + A) & 0x0ffffffff;
            		H1 = (H1 + B) & 0x0ffffffff;
            		H2 = (H2 + C) & 0x0ffffffff;
            		H3 = (H3 + D) & 0x0ffffffff;
            		H4 = (H4 + E) & 0x0ffffffff;
            	}

            	return toHex(H0) + toHex(H1) + toHex(H2) + toHex(H3) + toHex(H4);
            }

            // --- Client OVH -------------------------------------------------------------
            var OVH = {
            	params: {},
            	base_url: null,
            	time_diff: 0,

            	setParams: function (params) {
            		['application_key', 'application_secret', 'consumer_key', 'endpoint'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: ' + field + '.';
            			}
            		});

            		OVH.params = params;

            		switch (params.endpoint) {
            			case 'ovh-eu':
            				OVH.base_url = 'https://eu.api.ovh.com/1.0';
            				break;
            			case 'ovh-ca':
            				OVH.base_url = 'https://ca.api.ovh.com/1.0';
            				break;
            			case 'ovh-us':
            				OVH.base_url = 'https://api.us.ovhcloud.com/1.0';
            				break;
            			default:
            				throw 'Unsupported endpoint: "' + params.endpoint + '". Expected "ovh-eu", "ovh-ca" or "ovh-us".';
            		}
            	},

            	// Synchronisation d'horloge : indispensable, OVH rejette les signatures
            	// dont le timestamp dérive trop de l'heure serveur. Endpoint non authentifié.
            	syncTime: function () {
            		var request = new HttpRequest();
            		if (typeof OVH.params.proxy !== 'undefined' && OVH.params.proxy !== '') {
            			request.setProxy(OVH.params.proxy);
            		}

            		var response = request.get(OVH.base_url + '/auth/time');

            		if (request.getStatus() !== 200 || response === null || response === '') {
            			throw 'Failed to get OVH server time (status ' + request.getStatus() + ').';
            		}

            		OVH.time_diff = parseInt(response, 10) - Math.floor(Date.now() / 1000);
            	},

            	sign: function (method, url, body) {
            		var timestamp = Math.floor(Date.now() / 1000) + OVH.time_diff,
            			to_sign = OVH.params.application_secret + '+' + OVH.params.consumer_key + '+' +
            				method + '+' + url + '+' + body + '+' + timestamp;

            		return { timestamp: timestamp, signature: '$1$' + sha1(to_sign) };
            	},

            	request: function (method, path, data) {
            		if (typeof data === 'undefined' || data === null) {
            			data = '';
            		}

            		var url = OVH.base_url + path,
            			signed = OVH.sign(method, url, data),
            			request = new HttpRequest(),
            			response;

            		if (typeof OVH.params.proxy !== 'undefined' && OVH.params.proxy !== '') {
            			request.setProxy(OVH.params.proxy);
            		}

            		request.addHeader('Content-Type: application/json;charset=utf-8');
            		request.addHeader('X-Ovh-Application: ' + OVH.params.application_key);
            		request.addHeader('X-Ovh-Consumer: ' + OVH.params.consumer_key);
            		request.addHeader('X-Ovh-Timestamp: ' + signed.timestamp);
            		request.addHeader('X-Ovh-Signature: ' + signed.signature);

            		Zabbix.log(4, '[ OVH ] Sending request: ' + method + ' ' + url);

            		if (method === 'POST') {
            			response = request.post(url, data);
            		}
            		else if (method === 'PUT') {
            			response = request.put(url, data);
            		}
            		else {
            			response = request.get(url);
            		}

            		Zabbix.log(4, '[ OVH ] Received response with status code ' + request.getStatus() + ': ' + response);

            		if (request.getStatus() === 403) {
            			throw 'Forbidden (403) on ' + method + ' ' + path + '. Check that the consumer_key access rules ' +
            				'include BOTH the exact path and the wildcard (e.g. "' + path + '" AND "' + path + '/*"), ' +
            				'not just one of the two. Raw response: ' + response;
            		}

            		if (request.getStatus() !== 200 || response === null) {
            			throw 'Request failed with status code ' + request.getStatus() + ': ' + response;
            		}

            		try {
            			return JSON.parse(response);
            		}
            		catch (error) {
            			throw 'Failed to parse response received from API.';
            		}
            	},

            	// Helper de normalisation pour la LLD : un format plat commun aux 3 familles.
            	// "extra" (optionnel) permet d'ajouter des champs racine spécifiques à une
            	// famille (ex. projectId/projectName pour Public Cloud) sans jamais les
            	// concaténer dans serviceName ('/' est interdit dans les macros LLD Zabbix).
            	pushResource: function (list, resourceType, serviceName, name, status, location, raw, extra) {
            		var item = {
            			resourceType: resourceType,   // PUBLICCLOUD_INSTANCE | VPS | DEDICATED_SERVER
            			serviceName: serviceName,     // identifiant OVH natif (jamais composite)
            			name: name,
            			status: status,
            			location: location,
            			raw: raw
            		};

            		if (typeof extra === 'object' && extra !== null) {
            			for (var key in extra) {
            				item[key] = extra[key];
            			}
            		}

            		list.push(item);
            	}
            };

            var result,
            	data = { errors: {}, resources: { value: [] } };

            try {
            	OVH.setParams(JSON.parse(value));
            	OVH.syncTime();
            }
            catch (error) {
            	data.errors.auth = error.toString();
            }

            if (!('auth' in data.errors)) {

            	// --- 1. Public Cloud : projets -> instances ---------------------------
            	try {
            		var projects = OVH.request('GET', '/cloud/project');

            		projects.forEach(function (project_id) {
            			// Récupération du libellé du projet (champ "description" côté OVH) :
            			// si l'appel échoue (ex. permission manquante sur le chemin exact
            			// /cloud/project/{serviceName}), on retombe sur l'id brut plutôt
            			// que de faire échouer toute la famille de ressources.
            			var project_name = project_id;
            			try {
            				var project_info = OVH.request('GET', '/cloud/project/' + encodeURIComponent(project_id));
            				if (project_info && project_info.description) {
            					project_name = project_info.description;
            				}
            			}
            			catch (project_error) {
            				Zabbix.log(3, '[ OVH ] Cannot fetch project description for ' + project_id + ': ' + project_error);
            			}

            			var instances = OVH.request('GET', '/cloud/project/' + encodeURIComponent(project_id) + '/instance');

            			instances.forEach(function (instance) {
            				OVH.pushResource(
            					data.resources.value,
            					'PUBLICCLOUD_INSTANCE',
            					instance.id,        // id natif de la VM, jamais composite
            					instance.name,
            					instance.status,
            					instance.region,
            					instance,
            					{ projectId: project_id, projectName: project_name }
            				);
            			});
            		});
            	}
            	catch (error) {
            		data.errors.publiccloud = error.toString();
            	}

            	// --- 2. VPS -------------------------------------------------------------
            	try {
            		var vps_list = OVH.request('GET', '/vps');

            		vps_list.forEach(function (service_name) {
            			var vps = OVH.request('GET', '/vps/' + encodeURIComponent(service_name));

            			OVH.pushResource(
            				data.resources.value,
            				'VPS',
            				service_name,
            				vps.displayName || service_name,
            				vps.state,
            				vps.zone,
            				vps
            			);
            		});
            	}
            	catch (error) {
            		data.errors.vps = error.toString();
            	}

            	// --- 3. Serveurs dédiés (bare metal) -------------------------------------
            	try {
            		var dedicated_list = OVH.request('GET', '/dedicated/server');

            		dedicated_list.forEach(function (service_name) {
            			var server = OVH.request('GET', '/dedicated/server/' + encodeURIComponent(service_name));

            			OVH.pushResource(
            				data.resources.value,
            				'DEDICATED_SERVER',
            				service_name,
            				server.reverse || service_name,
            				server.state,
            				server.datacenter,
            				server
            			);
            		});
            	}
            	catch (error) {
            		data.errors.dedicated = error.toString();
            	}
            }

            if (Object.keys(data.errors).length !== 0) {
            	var errors = 'Failed to receive data:';
            	for (var error in data.errors) {
            		errors += '\n' + error + ' : ' + data.errors[error];
            	}
            	data.errors = errors;
            }
            else {
            	data.errors = '';
            }

            return JSON.stringify(data);
          timeout: 15s
          parameters:
            - name: application_key
              value: '{$OVH.APP_ID}'
            - name: application_secret
              value: '{$OVH.APP_SECRET}'
            - name: consumer_key
              value: '{$OVH.CONSUMER_KEY}'
            - name: endpoint
              value: '{$OVH.ENDPOINT}'
            - name: proxy
              value: '{$OVH.PROXY}'
          tags:
            - tag: component
              value: raw
            - tag: provider
              value: ovh
            - tag: scope
              value: monitoring

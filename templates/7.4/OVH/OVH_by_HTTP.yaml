        - uuid: 0d9ccad844254db8a11ea632f1d9deb8
          name: 'OVH get costs data (script)'
          type: SCRIPT
          key: ovh.cost.raw
          delay: '6h;1d/6-7,00:00-24:00'
          history: '0'
          value_type: TEXT
          params: |
            /*
             * Zabbix master item (Script) - Collecte de la FACTURATION OVH (mois en cours)
             *
             * Rôle : interroger /me/bill pour la période en cours et retourner un JSON
             * "sparse" (uniquement ce qui a été effectivement facturé). Ne connaît RIEN
             * des noms/catégories de service : cette responsabilité vit entièrement dans
             * ovh_billing_discovery.js. Les deux scripts sont indépendants, ne partagent
             * aucun état, et ne tombent jamais en panne ensemble pour la même raison.
             *
             * Paramètres attendus dans "value" (JSON) : identiques à
             * ovh_billing_discovery.js (application_key, application_secret,
             * consumer_key, endpoint, proxy optionnel).
             *
             * Sortie :
             * {
             *   "errors": "",
             *   "meta": {
             *     "period": "2026-09",
             *     "period_start": "2026-09-01",
             *     "period_end": "2026-09-16",
             *     "currency": "EUR"
             *   },
             *   "total": 313.08,
             *   "services": [
             *     { "id": "2ae493a69292437db9f6fe7e27bf45bf", "amount": 193.19 },
             *     { "id": "ekalys.net", "amount": 119.88 }
             *   ]
             * }
             *
             * Consumer key : droit nécessaire (lecture seule)
             *   GET /me/bill, GET /me/bill/*
             */

            // --- SHA-1 pur JS (identique à ovh_billing_discovery.js) -------------------
            function sha1(str) {
            	function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
            	function toHex(n) {
            		var s = '', v;
            		for (var i = 7; i >= 0; i--) {
            			v = (n >>> (i * 4)) & 0x0f;
            			s += v.toString(16);
            		}
            		return s;
            	}

            	str = unescape(encodeURIComponent(str));

            	var strLen = str.length,
            		wordArray = [];

            	for (var i = 0; i < strLen - 3; i += 4) {
            		wordArray.push(
            			(str.charCodeAt(i) << 24) |
            			(str.charCodeAt(i + 1) << 16) |
            			(str.charCodeAt(i + 2) << 8) |
            			(str.charCodeAt(i + 3))
            		);
            	}

            	switch (strLen % 4) {
            		case 0:
            			wordArray.push(0x080000000);
            			break;
            		case 1:
            			wordArray.push((str.charCodeAt(strLen - 1) << 24) | 0x0800000);
            			break;
            		case 2:
            			wordArray.push((str.charCodeAt(strLen - 2) << 24) | (str.charCodeAt(strLen - 1) << 16) | 0x08000);
            			break;
            		case 3:
            			wordArray.push((str.charCodeAt(strLen - 3) << 24) | (str.charCodeAt(strLen - 2) << 16) | (str.charCodeAt(strLen - 1) << 8) | 0x80);
            			break;
            	}

            	while ((wordArray.length % 16) !== 14) {
            		wordArray.push(0);
            	}
            	wordArray.push(strLen >>> 29);
            	wordArray.push((strLen << 3) & 0x0ffffffff);

            	var W = new Array(80),
            		H0 = 0x67452301, H1 = 0xEFCDAB89, H2 = 0x98BADCFE, H3 = 0x10325476, H4 = 0xC3D2E1F0,
            		A, B, C, D, E, temp;

            	for (var blockstart = 0; blockstart < wordArray.length; blockstart += 16) {
            		for (var i = 0; i < 16; i++) { W[i] = wordArray[blockstart + i]; }
            		for (var i = 16; i <= 79; i++) { W[i] = rotl(W[i - 3] ^ W[i - 8] ^ W[i - 14] ^ W[i - 16], 1); }

            		A = H0; B = H1; C = H2; D = H3; E = H4;

            		for (var i = 0; i <= 19; i++) {
            			temp = (rotl(A, 5) + ((B & C) | (~B & D)) + E + W[i] + 0x5A827999) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 20; i <= 39; i++) {
            			temp = (rotl(A, 5) + (B ^ C ^ D) + E + W[i] + 0x6ED9EBA1) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 40; i <= 59; i++) {
            			temp = (rotl(A, 5) + ((B & C) | (B & D) | (C & D)) + E + W[i] + 0x8F1BBCDC) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 60; i <= 79; i++) {
            			temp = (rotl(A, 5) + (B ^ C ^ D) + E + W[i] + 0xCA62C1D6) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}

            		H0 = (H0 + A) & 0x0ffffffff;
            		H1 = (H1 + B) & 0x0ffffffff;
            		H2 = (H2 + C) & 0x0ffffffff;
            		H3 = (H3 + D) & 0x0ffffffff;
            		H4 = (H4 + E) & 0x0ffffffff;
            	}

            	return toHex(H0) + toHex(H1) + toHex(H2) + toHex(H3) + toHex(H4);
            }

            // --- Client OVH --------------------------------------------------------------
            var OVH = {
            	params: {},
            	base_url: null,
            	time_diff: 0,
            	http: null,

            	setParams: function (params) {
            		['application_key', 'application_secret', 'consumer_key', 'endpoint'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: ' + field + '.';
            			}
            		});

            		OVH.params = params;

            		switch (params.endpoint) {
            			case 'ovh-eu':
            				OVH.base_url = 'https://eu.api.ovh.com/1.0';
            				break;
            			case 'ovh-ca':
            				OVH.base_url = 'https://ca.api.ovh.com/1.0';
            				break;
            			case 'ovh-us':
            				OVH.base_url = 'https://api.us.ovhcloud.com/1.0';
            				break;
            			default:
            				throw 'Unsupported endpoint: "' + params.endpoint + '". Expected "ovh-eu", "ovh-ca" or "ovh-us".';
            		}

            		OVH.http = new HttpRequest();
            		if (typeof params.proxy !== 'undefined' && params.proxy !== '') {
            			OVH.http.setProxy(params.proxy);
            		}
            	},

            	syncTime: function () {
            		OVH.http.clearHeader();
            		var response = OVH.http.get(OVH.base_url + '/auth/time');

            		if (OVH.http.getStatus() !== 200 || response === null || response === '') {
            			throw 'Failed to get OVH server time (status ' + OVH.http.getStatus() + ').';
            		}

            		OVH.time_diff = parseInt(response, 10) - Math.floor(Date.now() / 1000);
            	},

            	sign: function (method, url, body) {
            		var timestamp = Math.floor(Date.now() / 1000) + OVH.time_diff,
            			to_sign = OVH.params.application_secret + '+' + OVH.params.consumer_key + '+' +
            				method + '+' + url + '+' + body + '+' + timestamp;

            		return { timestamp: timestamp, signature: '$1$' + sha1(to_sign) };
            	},

            	request: function (method, path, query) {
            		var url = OVH.base_url + path + (query ? '?' + query : ''),
            			signed = OVH.sign(method, url, ''),
            			response;

            		OVH.http.clearHeader();
            		OVH.http.addHeader('Content-Type: application/json;charset=utf-8');
            		OVH.http.addHeader('X-Ovh-Application: ' + OVH.params.application_key);
            		OVH.http.addHeader('X-Ovh-Consumer: ' + OVH.params.consumer_key);
            		OVH.http.addHeader('X-Ovh-Timestamp: ' + signed.timestamp);
            		OVH.http.addHeader('X-Ovh-Signature: ' + signed.signature);

            		Zabbix.log(4, '[ OVH ] Sending request: ' + method + ' ' + url);
            		response = OVH.http.get(url);
            		Zabbix.log(4, '[ OVH ] Received response with status code ' + OVH.http.getStatus() + ': ' + response);

            		if (OVH.http.getStatus() === 403) {
            			throw 'Forbidden (403) on ' + method + ' ' + path + '. Check that the consumer_key access rules ' +
            				'include BOTH the exact path and the wildcard (e.g. "' + path + '" AND "' + path + '/*"). ' +
            				'Raw response: ' + response;
            		}

            		if (OVH.http.getStatus() !== 200 || response === null) {
            			throw 'Request failed with status code ' + OVH.http.getStatus() + ': ' + response;
            		}

            		try {
            			return JSON.parse(response);
            		}
            		catch (error) {
            			throw 'Failed to parse response received from API for ' + path + '.';
            		}
            	}
            };

            var data = {
            	errors: {},
            	meta: { period: '', period_start: '', period_end: '', currency: '' },
            	total: 0,
            	services: []
            };

            try {
            	OVH.setParams(JSON.parse(value));
            	OVH.syncTime();

            	// Bornes du mois en cours (UTC)
            	var now = new Date(),
            		period_start = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 1)),
            		from = period_start.toISOString().slice(0, 10),
            		to = now.toISOString().slice(0, 10);

            	data.meta.period = from.slice(0, 7);
            	data.meta.period_start = from;
            	data.meta.period_end = to;

            	var bill_ids = OVH.request('GET', '/me/bill', 'date.from=' + from + '&date.to=' + to);

            	// Agrégation par service : une même ligne "domain" peut apparaître sur
            	// plusieurs factures du mois (ex. facture normale + avoir).
            	var amounts_by_service = {};

            	var start_time = Date.now();

            	bill_ids.forEach(function (billId) {
            		try {
            			// L'en-tête de facture (devise) n'est lu qu'une seule fois : elle
            			// ne varie pas d'une facture à l'autre sur un même compte.
            			if (data.meta.currency === '') {
            				var bill = OVH.request('GET', '/me/bill/' + encodeURIComponent(billId));
            				data.meta.currency = bill.priceWithTax.currencyCode;
            			}

            			var detail_ids = OVH.request('GET', '/me/bill/' + encodeURIComponent(billId) + '/details');

            			detail_ids.forEach(function (detailId) {
            				var line = OVH.request('GET', '/me/bill/' + encodeURIComponent(billId) + '/details/' + encodeURIComponent(detailId)),
            					amount = line.totalPrice.value,
            					service_id = line.domain || 'unknown';

            				amounts_by_service[service_id] = (amounts_by_service[service_id] || 0) + amount;
            			});
            		}
            		catch (error) {
            			data.errors['bill_' + billId] = error.toString();
            		}
            	});

            	// Montants à 0€ exclus (bruit), négatifs conservés (avoirs réels).
            	for (var service_id in amounts_by_service) {
            		var amount = Math.round(amounts_by_service[service_id] * 100) / 100;
            		if (amount !== 0) {
            			data.services.push({ id: service_id, amount: amount });
            			data.total += amount;
            		}
            	}
            	data.total = Math.round(data.total * 100) / 100;

            	Zabbix.log(4, '[ OVH ] Billing collection finished in ' + (Date.now() - start_time) + ' ms for ' +
            		bill_ids.length + ' bill(s).');
            }
            catch (error) {
            	data.errors.auth = error.toString();
            }

            if (Object.keys(data.errors).length !== 0) {
            	var errors = 'Failed to receive data:';
            	for (var error_key in data.errors) {
            		errors += '\n' + error_key + ' : ' + data.errors[error_key];
            	}
            	data.errors = errors;
            }
            else {
            	data.errors = '';
            }

            return JSON.stringify(data);
          timeout: 180s

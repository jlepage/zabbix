        - uuid: ed0738a5b2a44a1492b6ec2fb9a98995
          name: 'OVH 6 months forecast'
          type: CALCULATED
          key: 'ovh.cost.forecast.months[6]'
          delay: '1h;0/6-7,00:00-24:00'

              name: 'Category cost : {#SERVICE.CATEGORY}'
              type: CALCULATED
              key: 'ovh.billing.category.total[{#SERVICE.CATEGORY}]'
              delay: '3h;12h/6-7,00:00-24:00'
              history: 730d
              value_type: FLOAT
              trends: 730d
              units: €
              params: 'sum(last_foreach(/*/ovh.billing.service.cost[*]?[tag="category:{#SERVICE.CATEGORY}"]))'
              tags:
                - tag: category
                  value: '{#SERVICE.CATEGORY}'
                - tag: cost
                  value: aggregation
          master_item:
            key: ovh.cost.discovery
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value), seen = {}, lld = [];
                  data.billing.value.forEach(function (s) {
                  	if (!seen[s.category]) {
                  		seen[s.category] = true;
                  		lld.push({ '{#SERVICE.CATEGORY}': s.category });
                  	}
                  });
                  return JSON.stringify(lld);

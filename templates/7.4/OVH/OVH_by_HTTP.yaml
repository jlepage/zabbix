        - uuid: c8dd86078a5f483f95444cf55bb4116b
          name: 'OVH costs discovery'
          type: SCRIPT
          key: ovh.cost.discovery
          delay: '6h;1d/6-7,00:00-24:00'
          history: '0'
          value_type: TEXT
          params: |
            /*
             * Zabbix master item (Script) - Découverte des SERVICES FACTURABLES OVH
             *
             * Rôle : alimenter la LLD "Services facturables" et la LLD dérivée
             * "Catégories de facturation". Volontairement DÉCOUPLÉ du script de
             * découverte des hôtes (ovh_resources_discovery.js / existant) :
             *   - granularité = granularité de facturation OVH (le projet cloud,
             *     pas l'instance), pas granularité de supervision
             *   - périmètre = tout ce qui coûte de l'argent, pas seulement ce qui
             *     est "monitorable" (domaines, NAS-HA inclus)
             *   - aucune dépendance : une panne ici n'affecte jamais la découverte
             *     des hôtes, et inversement
             *
             * Paramètres attendus dans "value" (JSON) :
             * {
             *   "application_key":    "...",
             *   "application_secret": "...",
             *   "consumer_key":       "...",
             *   "endpoint":           "ovh-eu" | "ovh-ca" | "ovh-us",
             *   "proxy":              "" // optionnel
             * }
             *
             * Sortie :
             * {
             *   "errors": "",
             *   "billing": {
             *     "value": [
             *       { "serviceName": "...", "name": "...", "category": "cloud|dedicated|domain|storage" },
             *       ...
             *     ]
             *   }
             * }
             *
             * Consumer key : droits nécessaires (lecture seule)
             *   GET /cloud/project, GET /cloud/project/*
             *   GET /vps, GET /vps/*
             *   GET /dedicated/server, GET /dedicated/server/*
             *   GET /domain
             *   GET /dedicated/nasha
             */

            // --- SHA-1 pur JS (Duktape ne fournit que md5()/sha256() en natif) ---------
            function sha1(str) {
            	function rotl(n, s) { return (n << s) | (n >>> (32 - s)); }
            	function toHex(n) {
            		var s = '', v;
            		for (var i = 7; i >= 0; i--) {
            			v = (n >>> (i * 4)) & 0x0f;
            			s += v.toString(16);
            		}
            		return s;
            	}

            	str = unescape(encodeURIComponent(str)); // normalisation UTF-8 -> octets

            	var strLen = str.length,
            		wordArray = [];

            	for (var i = 0; i < strLen - 3; i += 4) {
            		wordArray.push(
            			(str.charCodeAt(i) << 24) |
            			(str.charCodeAt(i + 1) << 16) |
            			(str.charCodeAt(i + 2) << 8) |
            			(str.charCodeAt(i + 3))
            		);
            	}

            	switch (strLen % 4) {
            		case 0:
            			wordArray.push(0x080000000);
            			break;
            		case 1:
            			wordArray.push((str.charCodeAt(strLen - 1) << 24) | 0x0800000);
            			break;
            		case 2:
            			wordArray.push((str.charCodeAt(strLen - 2) << 24) | (str.charCodeAt(strLen - 1) << 16) | 0x08000);
            			break;
            		case 3:
            			wordArray.push((str.charCodeAt(strLen - 3) << 24) | (str.charCodeAt(strLen - 2) << 16) | (str.charCodeAt(strLen - 1) << 8) | 0x80);
            			break;
            	}

            	while ((wordArray.length % 16) !== 14) {
            		wordArray.push(0);
            	}
            	wordArray.push(strLen >>> 29);
            	wordArray.push((strLen << 3) & 0x0ffffffff);

            	var W = new Array(80),
            		H0 = 0x67452301, H1 = 0xEFCDAB89, H2 = 0x98BADCFE, H3 = 0x10325476, H4 = 0xC3D2E1F0,
            		A, B, C, D, E, temp;

            	for (var blockstart = 0; blockstart < wordArray.length; blockstart += 16) {
            		for (var i = 0; i < 16; i++) { W[i] = wordArray[blockstart + i]; }
            		for (var i = 16; i <= 79; i++) { W[i] = rotl(W[i - 3] ^ W[i - 8] ^ W[i - 14] ^ W[i - 16], 1); }

            		A = H0; B = H1; C = H2; D = H3; E = H4;

            		for (var i = 0; i <= 19; i++) {
            			temp = (rotl(A, 5) + ((B & C) | (~B & D)) + E + W[i] + 0x5A827999) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 20; i <= 39; i++) {
            			temp = (rotl(A, 5) + (B ^ C ^ D) + E + W[i] + 0x6ED9EBA1) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 40; i <= 59; i++) {
            			temp = (rotl(A, 5) + ((B & C) | (B & D) | (C & D)) + E + W[i] + 0x8F1BBCDC) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}
            		for (var i = 60; i <= 79; i++) {
            			temp = (rotl(A, 5) + (B ^ C ^ D) + E + W[i] + 0xCA62C1D6) & 0x0ffffffff;
            			E = D; D = C; C = rotl(B, 30); B = A; A = temp;
            		}

            		H0 = (H0 + A) & 0x0ffffffff;
            		H1 = (H1 + B) & 0x0ffffffff;
            		H2 = (H2 + C) & 0x0ffffffff;
            		H3 = (H3 + D) & 0x0ffffffff;
            		H4 = (H4 + E) & 0x0ffffffff;
            	}

            	return toHex(H0) + toHex(H1) + toHex(H2) + toHex(H3) + toHex(H4);
            }

            // --- Client OVH (une seule instance HttpRequest réutilisée : limite Zabbix
            //     de 10 instanciations par exécution, aucune limite sur le nombre
            //     d'appels .get()/.post() sur une même instance) -----------------------
            var OVH = {
            	params: {},
            	base_url: null,
            	time_diff: 0,
            	http: null,

            	setParams: function (params) {
            		['application_key', 'application_secret', 'consumer_key', 'endpoint'].forEach(function (field) {
            			if (typeof params !== 'object' || typeof params[field] === 'undefined' || params[field] === '') {
            				throw 'Required param is not set: ' + field + '.';
            			}
            		});

            		OVH.params = params;

            		switch (params.endpoint) {
            			case 'ovh-eu':
            				OVH.base_url = 'https://eu.api.ovh.com/1.0';
            				break;
            			case 'ovh-ca':
            				OVH.base_url = 'https://ca.api.ovh.com/1.0';
            				break;
            			case 'ovh-us':
            				OVH.base_url = 'https://api.us.ovhcloud.com/1.0';
            				break;
            			default:
            				throw 'Unsupported endpoint: "' + params.endpoint + '". Expected "ovh-eu", "ovh-ca" or "ovh-us".';
            		}

            		OVH.http = new HttpRequest();
            		if (typeof params.proxy !== 'undefined' && params.proxy !== '') {
            			OVH.http.setProxy(params.proxy);
            		}
            	},

            	// Synchronisation d'horloge : indispensable, OVH rejette les signatures
            	// dont le timestamp dérive trop de l'heure serveur. Endpoint non authentifié.
            	syncTime: function () {
            		OVH.http.clearHeader();
            		var response = OVH.http.get(OVH.base_url + '/auth/time');

            		if (OVH.http.getStatus() !== 200 || response === null || response === '') {
            			throw 'Failed to get OVH server time (status ' + OVH.http.getStatus() + ').';
            		}

            		OVH.time_diff = parseInt(response, 10) - Math.floor(Date.now() / 1000);
            	},

            	sign: function (method, url, body) {
            		var timestamp = Math.floor(Date.now() / 1000) + OVH.time_diff,
            			to_sign = OVH.params.application_secret + '+' + OVH.params.consumer_key + '+' +
            				method + '+' + url + '+' + body + '+' + timestamp;

            		return { timestamp: timestamp, signature: '$1$' + sha1(to_sign) };
            	},

            	request: function (method, path) {
            		var url = OVH.base_url + path,
            			signed = OVH.sign(method, url, ''),
            			response;

            		OVH.http.clearHeader();
            		OVH.http.addHeader('Content-Type: application/json;charset=utf-8');
            		OVH.http.addHeader('X-Ovh-Application: ' + OVH.params.application_key);
            		OVH.http.addHeader('X-Ovh-Consumer: ' + OVH.params.consumer_key);
            		OVH.http.addHeader('X-Ovh-Timestamp: ' + signed.timestamp);
            		OVH.http.addHeader('X-Ovh-Signature: ' + signed.signature);

            		Zabbix.log(4, '[ OVH ] Sending request: ' + method + ' ' + url);
            		response = OVH.http.get(url);
            		Zabbix.log(4, '[ OVH ] Received response with status code ' + OVH.http.getStatus() + ': ' + response);

            		if (OVH.http.getStatus() === 403) {
            			throw 'Forbidden (403) on ' + method + ' ' + path + '. Check that the consumer_key access rules ' +
            				'include BOTH the exact path and the wildcard (e.g. "' + path + '" AND "' + path + '/*"). ' +
            				'Raw response: ' + response;
            		}

            		if (OVH.http.getStatus() !== 200 || response === null) {
            			throw 'Request failed with status code ' + OVH.http.getStatus() + ': ' + response;
            		}

            		try {
            			return JSON.parse(response);
            		}
            		catch (error) {
            			throw 'Failed to parse response received from API for ' + path + '.';
            		}
            	}
            };

            var data = { errors: {}, billing: { value: [] } };

            try {
            	OVH.setParams(JSON.parse(value));
            	OVH.syncTime();
            }
            catch (error) {
            	data.errors.auth = error.toString();
            }

            if (!('auth' in data.errors)) {

            	// --- 1. Public Cloud : granularité PROJET (= granularité de facturation
            	//        OVH ; jamais l'instance, contrairement au script de découverte
            	//        des hôtes). Aucune descente dans /instance ici. -----------------
            	try {
            		var projects = OVH.request('GET', '/cloud/project');

            		projects.forEach(function (project_id) {
            			var project_name = project_id;
            			try {
            				var project_info = OVH.request('GET', '/cloud/project/' + encodeURIComponent(project_id));
            				if (project_info && project_info.description) {
            					project_name = project_info.description;
            				}
            			}
            			catch (project_error) {
            				Zabbix.log(3, '[ OVH ] Cannot fetch project description for ' + project_id + ': ' + project_error);
            			}

            			data.billing.value.push({ serviceName: project_id, name: project_name, category: 'cloud' });
            		});
            	}
            	catch (error) {
            		data.errors.cloud = error.toString();
            	}

            	// --- 2. VPS ---------------------------------------------------------------
            	try {
            		var vps_list = OVH.request('GET', '/vps');

            		vps_list.forEach(function (service_name) {
            			var vps_name = service_name;
            			try {
            				var vps = OVH.request('GET', '/vps/' + encodeURIComponent(service_name));
            				vps_name = vps.displayName || service_name;
            			}
            			catch (vps_error) {
            				Zabbix.log(3, '[ OVH ] Cannot fetch VPS details for ' + service_name + ': ' + vps_error);
            			}

            			data.billing.value.push({ serviceName: service_name, name: vps_name, category: 'cloud' });
            		});
            	}
            	catch (error) {
            		data.errors.vps = error.toString();
            	}

            	// --- 3. Serveurs dédiés (bare metal) --------------------------------------
            	try {
            		var dedicated_list = OVH.request('GET', '/dedicated/server');

            		dedicated_list.forEach(function (service_name) {
            			var server_name = service_name;
            			try {
            				var server = OVH.request('GET', '/dedicated/server/' + encodeURIComponent(service_name));
            				server_name = server.reverse || service_name;
            			}
            			catch (server_error) {
            				Zabbix.log(3, '[ OVH ] Cannot fetch dedicated server details for ' + service_name + ': ' + server_error);
            			}

            			data.billing.value.push({ serviceName: service_name, name: server_name, category: 'dedicated' });
            		});
            	}
            	catch (error) {
            		data.errors.dedicated = error.toString();
            	}

            	// --- 4. Domaines : liste directe, le nom de domaine EST le libellé -------
            	//        lisible, aucun appel de détail nécessaire.
            	try {
            		var domain_list = OVH.request('GET', '/domain');

            		domain_list.forEach(function (domain_name) {
            			data.billing.value.push({ serviceName: domain_name, name: domain_name, category: 'domain' });
            		});
            	}
            	catch (error) {
            		data.errors.domain = error.toString();
            	}

            	// --- 5. NAS-HA : liste directe également — pas de champ de libellé --------
            	//        distinct du serviceName côté API OVH.
            	try {
            		var nasha_list = OVH.request('GET', '/dedicated/nasha');

            		nasha_list.forEach(function (service_name) {
            			data.billing.value.push({ serviceName: service_name, name: service_name, category: 'storage' });
            		});
            	}
            	catch (error) {
            		data.errors.nasha = error.toString();
            	}
            }

            if (Object.keys(data.errors).length !== 0) {
            	var errors = 'Failed to receive data:';
            	for (var error_key in data.errors) {
            		errors += '\n' + error_key + ' : ' + data.errors[error_key];
            	}
            	data.errors = errors;
            }
            else {
            	data.errors = '';
            }

            return JSON.stringify(data);
          timeout: 15s
          parameters:
            - name: application_key
              value: '{$OVH.APP_ID}'
            - name: application_secret
              value: '{$OVH.APP_SECRET}'
            - name: consumer_key
              value: '{$OVH.CONSUMER_KEY}'
            - name: endpoint
              value: '{$OVH.ENDPOINT}'
            - name: proxy
              value: '{$OVH.PROXY}'
          tags:
            - tag: component
              value: discovery
            - tag: provider
              value: ovh
            - tag: scope
              value: cost
        - uuid: c1eaef6c11584aa1bb35de25547e33c5
          name: 'OVH 3 months forecast'
          type: CALCULATED

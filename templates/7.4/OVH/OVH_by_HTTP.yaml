              key: 'ovh.billing.service.forecast.6_months["{#SERVICE.ID}"]'
              delay: 6h
              value_type: FLOAT
              units: €
              params: 'forecast(//ovh.billing.service.cost["{#SERVICE.ID}"], 180d, 180d, "linear", "value")'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value < 0) {
                          return 0;
                      }
                      return Math.round(value, 2);
              tags:
                - tag: period
                  value: '6 months'
                - tag: scope
                  value: forecast
                - tag: service
                  value: '{#SERVICE.NAME}'
            - uuid: 75bd589e1b5346d1b1a2d0c6ce9eed18
              name: 'Service ''{#SERVICE.NAME}'' timeleft reaches budget'
              type: CALCULATED
              key: 'ovh.billing.service.timeleft["{#SERVICE.ID}"]'
              value_type: FLOAT
              units: s
              params: 'timeleft(//ovh.billing.service.cost["{#SERVICE.ID}"], 180d, {$OVH.BUDGET:"{#SERVICE.NAME}"}, "linear")'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value < 0) {
                          return 0;
                      }
                      return Math.round(value, 2);
              tags:
                - tag: scope
                  value: timeleft
                - tag: service
                  value: '{#SERVICE.NAME}'
          graph_prototypes:
            - uuid: 6ad6a31097fb43c7be59e768912445aa
              name: '{#SERVICE.NAME} - Cost vs Forecast'
